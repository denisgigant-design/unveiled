// Page-only adjustment: keep the original Unveiled app, assets and other rooms intact.
const editions = [
  ['red','Red'],
  ['green','Green'],
  ['navy','Blue'],
  ['pink','Pink'],
  ['purple','Purple']
];
const main = document.querySelector('#main');
let openSelectedEdition = false;
function isDiscovery() {
  return !location.hash || location.hash === '#home';
}
function renderDiscovery() {
  if (!isDiscovery() || main.querySelector('.discover-gallery')) return;
  main.innerHTML = `<section class="discover-gallery" aria-label="Discover Unveiled">
    <div class="discover-knights">
      <img src="assets/knights-night.png" alt="The three Unveiled knights in silver and gold" fetchpriority="high">
    </div>
    <nav class="discover-bibles" aria-label="Select your Bible colour">
      ${editions.map(([colour,label]) => `<button type="button" class="discover-bible"
        data-book-colour="${colour}" data-route="bible"
        aria-label="Open the ${label} Bible">
          <img src="assets/bible-cover-${colour}.webp" alt="" loading="eager">
          <span>${label}</span>
        </button>`).join('')}
    </nav>
  </section>`;
}
function syncEditionNavigation() {
  if (!openSelectedEdition || location.hash !== '#bible') return;
  const coverButton = main.querySelector('[data-open-book]');
  if (coverButton) {
    openSelectedEdition = false;
    // Keep the existing Bible opening behaviour: go straight to two open pages.
    coverButton.click();
  } else if (main.querySelector('.book-spread, #reader-workspace')) {
    openSelectedEdition = false;
  }
}
document.addEventListener('click', (event) => {
  if (event.target.closest('.discover-bible[data-book-colour]')) {
    openSelectedEdition = true;
  }
}, true);
// The original app registers the colour and route handlers, so retain those.
const observer = new MutationObserver(() => {
  renderDiscovery();
  syncEditionNavigation();
});
observer.observe(main, {childList:true});
renderDiscovery();

<script type="module" id="unveiled-bible-compact-js">// Unveiled Bible controls are repositioned without replacing the reader logic.
// This keeps the five established book artworks and the page-turn engine intact.
const bibleMain = document.querySelector('#main');
const bibleDialog = document.querySelector('#site-dialog');
const mobileBible = matchMedia('(max-width:700px)');
let previousBibleRoute = null;
let initialModeSet = false;
let manuallyViewingCover = false;
let processingBibleLayout = false;
let queuedBibleLayout = false;

function arrangeBibleControls(host) {
  if (!host || host.dataset.compactRearranged === 'true') return;
  const colours = host.querySelector('.book-colour-choices');
  const size = host.querySelector('.reader-size-bar');
  const modes = host.querySelector('.book-view-control');
  const navigation = host.querySelector('.page-controls');
  if (!colours || !size || !modes || !navigation) return;
  host.dataset.compactRearranged = 'true';
  const panel = document.createElement('section');
  panel.className = 'reader-bottom-panel';
  panel.setAttribute('aria-label','Bible appearance and reading controls');
  panel.append(colours, size, modes);
  navigation.insertAdjacentElement('afterend',panel);
  const shortLabels={kjv:'KJV',asv:'ASV',bg:'BG · Polski'};
  host.querySelectorAll('#reader-version option').forEach(option => {
    if(shortLabels[option.value])option.textContent=shortLabels[option.value];
  });
}

function setReaderFontSize(value) {
  const host = bibleMain.querySelector('#reader-workspace');
  if (!host || bibleDialog?.open) return;
  const current = Number.parseInt(host.querySelector('#reader-size-value')?.textContent||'',10);
  if (!Number.isFinite(current) || current === value) return;
  const button = host.querySelector('button[data-settings]');
  if (!button) return;
  // Use the reader's own size control, including when a device account is signed in.
  button.click();
  const input = bibleDialog?.querySelector('input[name="size"]');
  if (!input) {
    if (bibleDialog?.open)bibleDialog.close();
    return;
  }
  input.value=String(value);
  input.dispatchEvent(new Event('input',{bubbles:true}));
  bibleDialog.close();
}

function restoreDefaultBibleLayout() {
  const host = bibleMain.querySelector('#reader-workspace');
  if (!host) return;
  const mode = mobileBible.matches ? 'single' : 'spread';
  const button = host.querySelector(`button[data-book-view="${mode}"]`);
  if (button && button.getAttribute('aria-pressed') !== 'true') button.click();
  setReaderFontSize(mode==='single' ? 8 : 5);
}

function updateBibleLayout() {
  if (processingBibleLayout) return;
  processingBibleLayout=true;
  try {
    const route=document.body.dataset.page;
    if (route !== previousBibleRoute) {
      previousBibleRoute=route;
      if (route === 'bible') {
        initialModeSet=false;
        manuallyViewingCover=false;
      } else {
        initialModeSet=false;
        manuallyViewingCover=false;
      }
    }
    if(route!=='bible')return;
    const cover=bibleMain.querySelector('.bible-cover-entry button[data-open-book]');
    if(cover && !manuallyViewingCover && !cover.disabled){
      // The cover is skipped on entry, while Cover below the book still works.
      cover.click();
      return;
    }
    const host=bibleMain.querySelector('#reader-workspace');
    if(!host)return;
    if(!initialModeSet){
      initialModeSet=true;
      restoreDefaultBibleLayout();
    }
    arrangeBibleControls(bibleMain.querySelector('#reader-workspace'));
  }finally{
    processingBibleLayout=false;
  }
}

function queueBibleLayout() {
  if (queuedBibleLayout)return;
  queuedBibleLayout=true;
  queueMicrotask(()=>{
    queuedBibleLayout=false;
    updateBibleLayout();
  });
}

document.addEventListener('click',event=>{
  const coverReturn=event.target.closest('[data-reader-cover]');
  if(coverReturn){
    manuallyViewingCover=true;
    initialModeSet=false;
  }
  if(event.target.closest('.bible-cover-entry [data-open-book]')){
    manuallyViewingCover=false;
    initialModeSet=false;
  }
  const userView=event.target.closest('#reader-workspace button[data-book-view]');
  if(userView){
    const desired=userView.dataset.bookView==='single'?8:5;
    // Run after the existing click handler draws the chosen view.
    queueMicrotask(()=>{
      setReaderFontSize(desired);
      queueBibleLayout();
    });
  }
},true);

const bibleObserver=new MutationObserver(queueBibleLayout);
bibleObserver.observe(bibleMain,{childList:true,subtree:false});
bibleObserver.observe(document.body,{attributes:true,attributeFilter:['data-page']});
// Rearranging child nodes does not change their event listeners: the original
// delegated click/change handlers remain on #reader-workspace.
mobileBible.addEventListener('change',()=>{
  if(document.body.dataset.page==='bible'){
    restoreDefaultBibleLayout();
    queueBibleLayout();
  }
});
queueBibleLayout();
</script></head><body><div id="ambient-scene" aria-hidden="true"></div><a class="skip-link" href="#main">Skip to content</a><aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside><div id="nav-scrim" class="nav-scrim" hidden></div><div class="site-frame"><header class="topbar" id="topbar"></header><main id="main" tabindex="-1"></main><footer class="site-footer"><span>UNVEILED <i>·</i> Beyond the veil. Into the light.</span><button class="plain-link" data-about>About & sources</button></footer></div>
