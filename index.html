// Page-only adjustment: keep the original Unveiled app, assets and other rooms intact.
const editions = [
  ['red','Red'],
  ['green','Green'],
  ['navy','Blue'],
  ['pink','Pink'],
  ['purple','Purple']
];
const main = document.querySelector('#main');
let openSelectedEdition = false;
function isDiscovery() {
  return !location.hash || location.hash === '#home';
}
function renderDiscovery() {
  if (!isDiscovery() || main.querySelector('.discover-gallery')) return;
  main.innerHTML = `<section class="discover-gallery" aria-label="Discover Unveiled">
    <div class="discover-knights">
      <img src="assets/knights-night.png" alt="The three Unveiled knights in silver and gold" fetchpriority="high">
    </div>
    <nav class="discover-bibles" aria-label="Select your Bible colour">
      ${editions.map(([colour,label]) => `<button type="button" class="discover-bible"
        data-book-colour="${colour}" data-route="bible"
        aria-label="Open the ${label} Bible">
          <img src="assets/bible-cover-${colour}.webp" alt="" loading="eager">
          <span>${label}</span>
        </button>`).join('')}
    </nav>
  </section>`;
}
function syncEditionNavigation() {
  if (!openSelectedEdition || location.hash !== '#bible') return;
  const coverButton = main.querySelector('[data-open-book]');
  if (coverButton) {
    openSelectedEdition = false;
    // Keep the existing Bible opening behaviour: go straight to two open pages.
    coverButton.click();
  } else if (main.querySelector('.book-spread, #reader-workspace')) {
    openSelectedEdition = false;
  }
}
document.addEventListener('click', (event) => {
  if (event.target.closest('.discover-bible[data-book-colour]')) {
    openSelectedEdition = true;
  }
}, true);
// The original app registers the colour and route handlers, so retain those.
const observer = new MutationObserver(() => {
  renderDiscovery();
  syncEditionNavigation();
});
observer.observe(main, {childList:true});
renderDiscovery();

  ? (mobileBible.matches ? 8 : 11)

let processingBibleLayout = false;

const gearSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 3.1a2.2 2.2 0 0 1 4.2 0l.3 1.3c.6.2 1.2.5 1.7.9l1.3-.4a2.2 2.2 0 0 1 2.8 2.8l-.4 1.3c.4.5.7 1.1.9 1.7l1.3.3a2.2 2.2 0 0 1 0 4.2l-1.3.3c-.2.6-.5 1.2-.9 1.7l.4 1.3a2.2 2.2 0 0 1-2.8 2.8l-1.3-.4c-.5.4-1.1.7-1.7.9l-.3 1.3a2.2 2.2 0 0 1-4.2 0l-.3-1.3c-.6-.2-1.2-.5-1.7-.9l-1.3.4a2.2 2.2 0 0 1-2.8-2.8l.4-1.3c-.4-.5-.7-1.1-.9-1.7l-1.3-.3a2.2 2.2 0 0 1 0-4.2l1.3-.3c.2-.6.5-1.2.9-1.7l-.4-1.3a2.2 2.2 0 0 1 2.8-2.8l1.3.4c.5-.4 1.1-.7 1.7-.9z"/><circle cx="12" cy="12" r="3.2"/></svg>`;
const bookSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v15M3 4.5c4-1 7-.3 9 1.2 2-1.5 5-2.2 9-1.2v14.6c-4-1-7-.3-9 1.2-2-1.5-5-2.2-9-1.2z"/></svg>`;

function setExpanded(expanded) {
  panelExpanded=Boolean(expanded);
  const host=bibleMain.querySelector('#reader-workspace');
  if(!host)return;
  const trigger=host.querySelector('.reader-gear-button');
  const triggerRow=host.querySelector('.reader-gear-row');

  const toolbar=host.querySelector('.reader-toolbar');
  const books=toolbar?.querySelector('.passage-select');
  const actions=toolbar?.querySelector('.reader-actions');
  const bookLabel=books?.querySelector('label:first-child');
  const chapterLabel=books?.querySelector('label:nth-child(2)');
  const translation=actions?.querySelector('#reader-version');
  const sizes=host.querySelector('.reader-size-bar');
  const colours=host.querySelector('.book-colour-choices');
  const modes=host.querySelector('.book-view-control');
  const navigation=host.querySelector('.page-controls');
  const book=host.querySelector('.book-luminosity');

  panel.id='reader-glass-panel';

    <div class="reader-glass-secondary"></div>
    <div class="reader-glass-footer"></div>
    <div class="reader-glass-extras"></div>`;
  const primary=panel.querySelector('.reader-glass-primary');
  [bookLabel,chapterLabel].forEach(label=>{
    const textNode=[...label.childNodes].find(node=>node.nodeType===Node.TEXT_NODE&&node.textContent.trim());
    if(textNode){const description=document.createElement('span');description.className='reader-glass-label';description.textContent=textNode.textContent.trim();textNode.replaceWith(description);}
  });
  const shortLabels={kjv:'KJV · King James Version',asv:'ASV · American Standard',bg:'BG · Biblia Gdańska'};
  translation.querySelectorAll('option').forEach(option=>{
    if(shortLabels[option.value])option.textContent=shortLabels[option.value];

  primary.append(bookLabel,chapterLabel,translation);

  const secondary=panel.querySelector('.reader-glass-secondary');
  const sizeControls=sizes.querySelector('.reader-size-controls');

  const advanced=sizeControls?.querySelector('[data-settings]');
  const extra=panel.querySelector('.reader-glass-extras');
  const footer=panel.querySelector('.reader-glass-footer');
  secondary.append(sizes);
  footer.append(colours,modes);

  extra.append(actions);
  if(advanced)extra.append(advanced);
  if(cover)extra.append(cover);

function setReaderFontSize(value) {
  const host=bibleMain.querySelector('#reader-workspace');
  if(!host||bibleDialog?.open)return;
  const current=Number.parseInt(host.querySelector('#reader-size-value')?.textContent||'',10);
  if(!Number.isFinite(current)||current===value)return;
  const settingsButton=host.querySelector('button[data-settings]');
  if(!settingsButton)return;
  settingsButton.click();
  const input=bibleDialog?.querySelector('input[name="size"]');
  if(!input){if(bibleDialog?.open)bibleDialog.close();return;}
  input.value=String(value);
  input.dispatchEvent(new Event('input',{bubbles:true}));
  bibleDialog.close();

function restoreDefaultBibleLayout() {
  const host=bibleMain.querySelector('#reader-workspace');
  if(!host)return;
  const mode=mobileBible.matches?'single':'spread';
  const button=host.querySelector(`button[data-book-view="${mode}"]`);
  if(button && button.getAttribute('aria-pressed')!=='true')button.click();

function updateBibleLayout() {
  if(processingBibleLayout)return;
  processingBibleLayout=true;
  try{
    const route=document.body.dataset.page;
    if(route!==previousBibleRoute){
      previousBibleRoute=route;
      initialModeSet=false;manuallyViewingCover=false;panelExpanded=false;
    }
    if(route!=='bible')return;
    const cover=bibleMain.querySelector('.bible-cover-entry button[data-open-book]');
    if(cover&&!manuallyViewingCover&&!cover.disabled){cover.click();return;}
    const host=bibleMain.querySelector('#reader-workspace');
    if(!host)return;
    if(!initialModeSet){initialModeSet=true;restoreDefaultBibleLayout();}
    arrangeBibleControls(bibleMain.querySelector('#reader-workspace'));
  }finally{processingBibleLayout=false;}
}

function queueBibleLayout(){
  if(queuedBibleLayout)return;
  queuedBibleLayout=true;
  queueMicrotask(()=>{queuedBibleLayout=false;updateBibleLayout();});
}

document.addEventListener('click',event=>{
  const toggle=event.target.closest('button[data-bible-panel-toggle]');
  if(toggle){event.preventDefault();setExpanded(!panelExpanded);return;}
  if(event.target.closest('[data-reader-cover]')){
    manuallyViewingCover=true;initialModeSet=false;panelExpanded=false;
  }
  if(event.target.closest('.bible-cover-entry [data-open-book]')){
    manuallyViewingCover=false;initialModeSet=false;
  }
  const view=event.target.closest('#reader-workspace button[data-book-view]');
  if(view){
    const font=bibleTextForView(view.dataset.bookView);
    queueMicrotask(()=>{setReaderFontSize(font);queueBibleLayout();});
  }
},true);

const bibleObserver=new MutationObserver(queueBibleLayout);
bibleObserver.observe(bibleMain,{childList:true,subtree:false});
bibleObserver.observe(document.body,{attributes:true,attributeFilter:['data-page']});
mobileBible.addEventListener('change',()=>{
  if(document.body.dataset.page==='bible'){
    restoreDefaultBibleLayout();queueBibleLayout();
  }
});
queueBibleLayout();

<script type="module" id="unveiled-bible-entry-v45">
// Scroll restoration must not resume midway through Discovery or an open book.
// This runs only at a route entrance and after the initial async reader render.
if ('scrollRestoration' in history) history.scrollRestoration='manual';
const pageMain=document.querySelector('#main');
let activeRoute=document.body.dataset.page||null;
let entryIsPending=false;
let entryReaderSeen=false;
let entrySelectionCleared=false;
let scrollInterrupted=false;
let scrollJobs=[];
let scrollCycle=0;

function entryAtTop(){
  if(scrollInterrupted)return;
  window.scrollTo(0,0);
  if(document.scrollingElement)document.scrollingElement.scrollTop=0;
}
function cancelTopJobs(){
  scrollJobs.forEach(clearTimeout);scrollJobs=[];
}
function ensureEntryAtTop(){
  const route=document.body.dataset.page||activeRoute;
  if(route!=='home'&&route!=='bible')return;
  cancelTopJobs();
  if(scrollInterrupted)return;
  const cycle=++scrollCycle;
  entryAtTop();
  requestAnimationFrame(()=>{if(cycle===scrollCycle)entryAtTop()});
  for(const delay of [45,140,330,650]){
    scrollJobs.push(setTimeout(()=>{if(cycle===scrollCycle)entryAtTop()},delay));
  }
}
function onReaderArrival(){
  const host=pageMain.querySelector('#reader-workspace');
  if(!host || document.body.dataset.page!=='bible')return;
  if(!entryReaderSeen){
    entryReaderSeen=true;
    // The legacy cover transition scrolls the spread into the viewport;
    // undo that once the real open book is mounted.
    ensureEntryAtTop();
  }
  if(entrySelectionCleared)return;
  const selection=host.querySelector('#selected-tools .verse-selection');
  if(selection){
    const deselect=selection.querySelector('button[data-deselect]');
    entrySelectionCleared=true;
    deselect?.click(); // The reader's own action clears its internal selected verse.
  }else if(host.querySelector('#selected-tools')){
    entrySelectionCleared=true;
  }else return;
  document.body.dataset.verseEntryReady='true';
}
function onRouteArrival(){
  const route=document.body.dataset.page||null;
  if(route!==activeRoute){
    activeRoute=route;
    entryReaderSeen=false;
    entrySelectionCleared=false;
    scrollInterrupted=false;
    delete document.body.dataset.verseEntryReady;
    if(route==='bible'||route==='home')ensureEntryAtTop();
    else cancelTopJobs();
  }
  if(route==='bible')onReaderArrival();
}
// Stop automatic scroll protection as soon as someone starts interacting.
for(const name of ['touchstart','wheel','pointerdown','keydown']){
  document.addEventListener(name,()=>{scrollInterrupted=true;cancelTopJobs()}, {capture:true,passive:true});
}
const entryObserver=new MutationObserver(onRouteArrival);
entryObserver.observe(document.body,{attributes:true,attributeFilter:['data-page']});
entryObserver.observe(pageMain,{childList:true,subtree:true});
window.addEventListener('pageshow',()=>{
  scrollInterrupted=false;
  ensureEntryAtTop();
});
window.addEventListener('hashchange',()=>{
  scrollInterrupted=false;
  ensureEntryAtTop();
});
window.addEventListener('load',()=>ensureEntryAtTop());
// The site can enter with its route already rendered before this module runs.
onRouteArrival();
if(activeRoute==='home'||activeRoute==='bible')ensureEntryAtTop();

</style><script type="module" id="unveiled-v49-reader-notes">// Unveiled v49: clean folios, contextual chapter reminders, and private folder organization.
// Reader pagination and device-account bookmark saving still use the original app.
(() => {
  const main=document.querySelector('#main');
  const dialog=document.querySelector('#site-dialog');
  const dialogBody=document.querySelector('#dialog-content');
  const dialogHeading=document.querySelector('#dialog-heading');
  if(!main||!dialog||!dialogBody)return;
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const storageKey='unveiled.v49.folder-library';
  const blank=()=>({folders:[],verses:{},notes:{}});
  let library;
  try{
    const obj=JSON.parse(localStorage.getItem(storageKey)||'null');
    library=obj&&Array.isArray(obj.folders)&&obj.verses&&obj.notes?obj:blank();
  }catch{library=blank();}
  function persist(){try{localStorage.setItem(storageKey,JSON.stringify(library));return true;}catch{return false;}}
  const folders=()=>library.folders;
  const folderName=id=>folders().find(f=>f.id===id)?.name||'Unfiled';
  const folderOptions=(selected='',includeAll=false)=>`${includeAll?'<option value="all">All folders</option>':''}<option value="">Unfiled</option>${folders().map(f=>`<option value="${esc(f.id)}" ${selected===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}`;
  function addFolder(name){
    const trimmed=String(name||'').trim().replace(/\s+/g,' ').slice(0,65);
    if(!trimmed)return null;
    const exists=folders().find(f=>f.name.toLocaleLowerCase()===trimmed.toLocaleLowerCase());
    if(exists)return exists.id;
    if(folders().length>=100)return null;
    const id='f-'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
    folders().push({id,name:trimmed});persist();return id;
  }
  const passageKey=(version,book,chapter,verse)=>`${version}:${book}:${chapter}:${verse}`;
  function currentVerse(){
    const host=main.querySelector('#reader-workspace');
    const selected=host?.querySelector('.verse-line.verse-selected[data-verse]');
    if(!selected)return null;
    const book=host.querySelector('#reader-book')?.value;
    const chapter=host.querySelector('#reader-chapter')?.value;
    const version=host.querySelector('#reader-version')?.value;
    return {book,chapter,version,verse:selected.dataset.verse,
      key:passageKey(version,book,chapter,selected.dataset.verse),
      label:`${host.querySelector('#reader-book option:checked')?.textContent||'Bible'} ${chapter}:${selected.dataset.verse}`};
  }
  function setModal(title,html){
    dialog.dataset.variant='unveiled-folders';
    dialogHeading.textContent=title;
    dialogBody.innerHTML=html;
    if(!dialog.open)dialog.showModal();
  }
  function closeModal(){dialog.close();}
  const createForm=(prefill='')=>`<div class="folder-creator"><input type="text" maxlength="65" data-new-folder-input aria-label="New folder name" placeholder="New folder name, e.g. Spirit" value="${esc(prefill)}"><button type="button" class="folder-glass-button" data-create-new-folder>+ Add folder</button></div>`;
  function assignVerseToFolder(ref,button){
    if(!ref)return;
    const selected=library.verses[ref.key]||'';
    setModal('Save verse to a folder',`<div class="folder-picker"><p><strong>${esc(ref.label)}</strong> — choose where to keep this verse. Saved verses remain available in your Bible bookmarks.</p><label class="folder-choice">Folder<select data-choose-folder>${folderOptions(selected)}</select></label>${createForm()}<div class="folder-actions"><button type="button" class="folder-glass-button" data-cancel-folder>Cancel</button><button type="button" class="folder-glass-button primary" data-save-verse-folder>Save verse</button></div></div>`);
    dialogBody.querySelector('[data-create-new-folder]').onclick=()=>{
      const input=dialogBody.querySelector('[data-new-folder-input]');
      const id=addFolder(input.value);
      if(!id){input.focus();return;}
      dialogBody.querySelector('[data-choose-folder]').innerHTML=folderOptions(id);
      input.value='';
    };
    dialogBody.querySelector('[data-cancel-folder]').onclick=closeModal;
    dialogBody.querySelector('[data-save-verse-folder]').onclick=()=>{
      const id=dialogBody.querySelector('[data-choose-folder]').value;
      if(id)library.verses[ref.key]=id;else delete library.verses[ref.key];
      persist();
      closeModal();
      // The existing reader retains responsibility for persisting the actual
      // bookmark, including into a signed-in device account.
      if(button.isConnected){
        button.dataset.folderBypass='true';
        button.click();
        delete button.dataset.folderBypass;
      }
    };
  }
  let shownFolder='all';
  function enhanceSavedVerses(){
    if(!dialog.open||dialogHeading.textContent!=='Your saved verses')return;
    if(dialogBody.querySelector('.folder-library'))return;
    dialogBody.dataset.folderEnhanced='true';
    dialog.dataset.variant='unveiled-folders';
    const list=dialogBody.querySelector('.saved-verses');
    const items=list?[...list.querySelectorAll('.saved-verse')]:[];
    const wrapper=document.createElement('div');wrapper.className='folder-library';
    const header=document.createElement('div');header.className='folder-tools-head';
    header.innerHTML='<p class="folder-hint">Organize your saved verses into topics such as Spirit, Grace, and Faith.</p>';
    const create=document.createElement('div');create.innerHTML=createForm();
    const chips=document.createElement('div');chips.className='folder-chips';
    const grouped=document.createElement('div');
    wrapper.append(header,create,chips,grouped);
    if(list){list.replaceChildren(wrapper);}else dialogBody.prepend(wrapper);
    create.querySelector('[data-create-new-folder]').onclick=()=>{
      const input=create.querySelector('[data-new-folder-input]');
      const id=addFolder(input.value);
      if(id){shownFolder=id;input.value='';refresh();}
      else input.focus();
    };
    function refresh(){
      chips.replaceChildren();grouped.replaceChildren();
      const labels=[{id:'all',name:'All'},{id:'',name:'Unfiled'},...folders()];
      for(const item of labels){
        const chip=document.createElement('button');chip.type='button';chip.className='folder-chip';
        chip.setAttribute('aria-pressed',String(shownFolder===item.id));chip.textContent=item.name;

      for(const id of folderIds){
        const own=items.filter(card=>{
          const passage=card.querySelector('[data-passage]')?.dataset.passage||'';
          const [book,chapter,verse,version]=passage.split(',');

  document.addEventListener('submit',event=>{

  },true);

    if(event.target.closest('#reader-workspace select'))queue();
  });

})();

// Sync the selected subsection capsule with the most recently chosen Bible.
// Blue is the first-visit default. The preference is intentionally just a colour;
// no private notes, account details or reading history are copied.
(() => {
  const palette={
    navy:{accent:'#6199ff',ink:'#071529'},
    blue:{accent:'#6199ff',ink:'#071529'},
    red:{accent:'#ff7179',ink:'#23060c'},
    green:{accent:'#4cdb9e',ink:'#092619'},
    pink:{accent:'#ff80c0',ink:'#30101f'},
    purple:{accent:'#c591ff',ink:'#210c39'}
  };
  const saveKey='unveiled.sidebar.last-bible-colour';
  const legacyKey='unveiled.v1.book-colour';
  const normalise=v=>String(v||'').toLowerCase()==='blue'?'navy':String(v||'').toLowerCase();
  function readKey(key){
    try{
      const raw=localStorage.getItem(key);
      if(!raw)return null;
      let value=raw;
      try{value=JSON.parse(raw);}catch{}
      return typeof value==='string'&&palette[normalise(value)]?normalise(value):null;
    }catch{return null;}
  }
  let current=readKey(saveKey)||readKey(legacyKey)||'navy';
  function applyColour(colour,persist=false){
    colour=normalise(colour);
    if(!palette[colour])return;
    if(colour===current&&!persist&&document.documentElement.style.getPropertyValue('--unveiled-nav-accent'))return;
    current=colour;
    const p=palette[colour];
    document.documentElement.style.setProperty('--unveiled-nav-accent',p.accent);
    document.documentElement.style.setProperty('--unveiled-nav-ink',p.ink);
    if(persist){
      try{localStorage.setItem(saveKey,JSON.stringify(colour));}catch{}
    }
  }
  applyColour(current);
  // An edition choice from Discovery OR inside the reader updates the highlight.
  document.addEventListener('click',event=>{
    const button=event.target.closest?.('button[data-book-colour]');
    if(button&&palette[normalise(button.dataset.bookColour)]){
      applyColour(button.dataset.bookColour,true);
    }
  },true);
  // Signed-in device accounts can restore their Bible colour when the reader mounts.
  const main=document.querySelector('#main');
  if(main){
    const syncActiveEdition=()=>{
      if(document.body.dataset.page!=='bible')return;
      const selected=main.querySelector('.book-colour-choices button[data-book-colour][aria-pressed="true"]');
      if(selected&&normalise(selected.dataset.bookColour)!==current){
        applyColour(selected.dataset.bookColour,true);
      }
    };
    const watcher=new MutationObserver(syncActiveEdition);
    watcher.observe(main,{childList:true,subtree:true,attributes:true,attributeFilter:['aria-pressed']});
    syncActiveEdition();
  }
  window.addEventListener('storage',event=>{
    if(event.key===saveKey||event.key===legacyKey){
      applyColour(readKey(saveKey)||readKey(legacyKey)||'navy');
    }
  });
})();

 };

   const ref=selectedVerse();if(!ref)return;
   if(ref.element.classList.contains('is-bookmarked')){
     if(nativeRemove(ref))clearHighlight();
   }else nativeSave();
   schedule();
 }
 function selectedButton(){
   const area=host(),ref=selectedVerse();if(!area||!ref)return;
   const btn=area.querySelector('#selected-tools button[data-bookmark],#selected-tools button[data-unified-save-toggle]');
   if(!btn)return;
   if(btn.hasAttribute('data-bookmark')){
     btn.removeAttribute('data-bookmark');btn.dataset.unifiedSaveToggle='';
   }
   const saved=ref.element.classList.contains('is-bookmarked');
   const label=saved?'Saved verse':'Save verse';
   if(btn.dataset.unifiedLabel!==label){
     const svg=btn.querySelector('svg')?.outerHTML||'<span aria-hidden="true">▣</span>';
     btn.innerHTML=`${svg}<span>${label}</span>`;
     btn.dataset.unifiedLabel=label;
     btn.setAttribute('aria-label',saved?'Remove saved verse and highlight':'Save this verse');
     btn.setAttribute('aria-pressed',String(saved));
   }
 }
 function colourDialog(){
   if(!dialog.open||dialog.dataset.variant!=='unveiled-folders')return;
   const style=getComputedStyle(document.body);
   for(const key of ['--bible-swatch','--bible-accent','--bible-glow']){
     const value=style.getPropertyValue(key).trim();
     if(value&&dialog.style.getPropertyValue(key)!==value)dialog.style.setProperty(key,value);
   }
 }
 function capturePosition(){
   const area=host();if(!area||!entryHandled||restoring)return;
   // Device accounts already persist private reading state internally.
   if(document.querySelector('.avatar-button > span[aria-hidden="true"]'))return;
   const book=Number(area.querySelector('#reader-book')?.value);
   const chapter=Number(area.querySelector('#reader-chapter')?.value);
   const version=area.querySelector('#reader-version')?.value;
   const verseElement=area.querySelector('.book-spread > .paper-page:not(.opening-title-leaf):not(.quiet-page) .verse-line[data-verse]');
   const verse=Number(verseElement?.dataset.verse);
   const p={book,chapter,verse,version};
   if(!valid(p))return;
   const signature=JSON.stringify(p);
   if(signature===lastSerialized)return;
   lastPosition=p;lastSerialized=signature;
   try{localStorage.setItem(progressKey,signature);}catch{}
 }
 function restoreAtEntry(){
   const area=host();if(!area||entryHandled||restoring)return;
   const chosen=lastPosition||(!originalReadingExists?{book:0,chapter:1,verse:1,version:'kjv'}:null);
   entryHandled=true;
   // A direct click on a saved verse, search result or passage is intentional;
   // never override that destination with the previous reading position.
   if(explicitPassage){explicitPassage=false;return;}
   if(!chosen)return;
   // Signed-in accounts have their own private reading progress; prefer it.
   if(document.querySelector('.avatar-button > span[aria-hidden="true"]'))return;
   const book=Number(area.querySelector('#reader-book')?.value),chapter=Number(area.querySelector('#reader-chapter')?.value);
   const version=area.querySelector('#reader-version')?.value;
   const verses=[...area.querySelectorAll('.book-spread > .paper-page .verse-line[data-verse]')].map(x=>Number(x.dataset.verse));
   if(book===chosen.book&&chapter===chosen.chapter&&version===chosen.version&&verses.includes(chosen.verse))return;
   restoring=true;
   const link=document.createElement('button');link.type='button';link.hidden=true;
   link.dataset.passage=[chosen.book,chosen.chapter,chosen.verse,chosen.version].join(',');
   link.dataset.internalResume='';
   document.body.append(link);
   try{link.click();}finally{link.remove();}
   // Route render is async. Do not snapshot the temporary loading screen.
   requestAnimationFrame(()=>{restoring=false;schedule();});
 }
 function patch(){
   const now=document.body.dataset.page||null;
   if(now!==route){route=now;entryHandled=false;restoring=false;lastHost=null;}
   colourDialog();
   const area=host();if(!area)return;
   if(area!==lastHost){lastHost=area;}
   restoreAtEntry();
   selectedButton();
   capturePosition();
 }
 function schedule(){if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;patch();});}
 // Event capture keeps the original click handlers, while treating highlighting
 // as an immediate save. No extra folder picker appears when choosing a colour.
 document.addEventListener('click',event=>{
   if(internalAction)return;
   const target=event.target;
   const userPassage=target.closest?.('[data-passage]');
   if(userPassage&&!userPassage.hasAttribute('data-internal-resume')){
     explicitPassage=true;entryHandled=false;
   }
   const toggle=target.closest?.('#reader-workspace button[data-unified-save-toggle]');
   if(toggle){event.preventDefault();event.stopImmediatePropagation();toggleSave();return;}
   const hl=target.closest?.('#reader-workspace button[data-highlight]');
   if(hl){
     if(hl.dataset.highlight==='none'){
       const ref=selectedVerse();
       if(ref?.element.classList.contains('is-bookmarked')){
         event.preventDefault();event.stopImmediatePropagation();
         nativeRemove(ref);clearHighlight();schedule();return;
       }
     }else {
       queueMicrotask(()=>{
         const ref=selectedVerse();
         if(ref&&!ref.element.classList.contains('is-bookmarked'))nativeSave();
         schedule();
       });
     }
   }
   if(target.closest?.('#reader-workspace button[data-turn],#reader-workspace button[data-book-view],#reader-workspace button[data-font-step]'))schedule();
 },true);
 const observer=new MutationObserver(records=>{
   if(records.some(r=>r.type==='childList'||(r.type==='attributes'&&r.attributeName==='data-page')))schedule();
 });
 observer.observe(document.body,{attributes:true,attributeFilter:['data-page']});
 observer.observe(main,{childList:true,subtree:true});
 observer.observe(document.querySelector('#dialog-content'),{childList:true,subtree:false});
 document.addEventListener('change',event=>{if(event.target.closest?.('#reader-workspace select'))schedule();});
 dialog.addEventListener('close',()=>schedule());
 window.addEventListener('pagehide',capturePosition);
 schedule();
})();
</script>
