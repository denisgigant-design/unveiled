<body><main id="hero">
<header class="nav"><a class="brand" href="https://denisgigant-design.github.io/unveiled/" aria-label="Unveiled homepage"><img src="https://raw.githubusercontent.com/denisgigant-design/unveiled/main/assets/unveiled-simple-logo.jpg" alt=""><div class="brand-name">Unveiled<small>THE WORD OF GOD</small></div></a><nav class="nav-links" aria-label="Main navigation"><a href="https://denisgigant-design.github.io/unveiled/">Discover</a><a href="https://denisgigant-design.github.io/unveiled/#bible">The Bible</a></nav><a class="pill" href="https://denisgigant-design.github.io/unveiled/#bible">Start reading</a></header>
<div class="headline"><p class="eyebrow">The Word of God</p><h1 class="wordmark">Unveiled</h1><p class="subline">Five covers. One Word.</p></div>
<div class="fallback" id="fallback" aria-label="Choose a Bible edition"></div>
<div class="selection" id="selection" aria-hidden="true"><span id="selectedName"></span><a id="readEdition" class="pill" href="https://denisgigant-design.github.io/unveiled/#bible">Open reader ↗</a><button id="clear" aria-label="Clear selection">×</button></div>
<footer class="footer"><span class="instruction" id="instruction">Move across the Bibles · click to select</span><div class="edition-list" id="editions" aria-label="Bible colours"></div><span class="status" id="status" role="status">Loading 3D edition…</span></footer>

</main>
<script>
const ROOT='https://raw.githubusercontent.com/denisgigant-design/unveiled/main/assets/';

BOOKS.forEach((b,i)=>{const e=document.createElement('button');e.className='edition';e.style.setProperty('--swatch',b.swatch);e.setAttribute('aria-pressed','false');e.innerHTML='<i aria-hidden="true"></i>'+b.label;e.addEventListener('click',()=>choose(i));list.append(e);const f=document.createElement('button');f.style.setProperty('--i',i-2);f.setAttribute('aria-label','Select '+b.label+' Bible');const img=new Image();img.src=b.url;img.alt=b.label+' Bible';f.append(img);f.addEventListener('click',()=>choose(i));fallback.append(f);});

read.addEventListener('click',()=>{if(selected<0)return;try{if(location.origin===new URL(SITE).origin)localStorage.setItem('unveiled.v1.book-colour',JSON.stringify(BOOKS[selected].id))}catch{}});

if(!reduced){for(const [el,delay,y,duration,blur] of [[document.querySelector('.headline'),150,30,1400,14],[document.querySelector('.nav'),650,-12,900,0],[document.querySelector('.footer'),850,12,900,0]])el.animate([{opacity:0,transform:`translateY(${y}px)`,filter:`blur(${blur}px)`},{opacity:1,transform:'translateY(0)',filter:'blur(0)'}],{duration,delay,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'});}

</script>
<script type="module">
try{
const THREE=await import('three');const {RoomEnvironment}=await import('three/addons/environments/RoomEnvironment.js');
const hero=document.querySelector('#hero'),status=document.querySelector('#status');

const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(27,1,.1,60);const room=new RoomEnvironment(),pmrem=new THREE.PMREMGenerator(renderer),env=pmrem.fromScene(room,.04);scene.environment=env.texture;room.dispose();pmrem.dispose();
function light(color,intensity,x,y,z){const l=new THREE.DirectionalLight(color,intensity);l.position.set(x,y,z);scene.add(l)}light(0xfff3e4,2.4,-4,6,6);light(0xbfd2ff,1.1,6,3,-4);scene.add(new THREE.AmbientLight(0xffffff,.12));
const maxAniso=renderer.capabilities.getMaxAnisotropy();function texCanvas(c){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(maxAniso,8);return t;}
function pages(vertical=false){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='#efe7d6';g.fillRect(0,0,256,256);for(let j=0;j<256;j+=2){g.fillStyle=`rgba(96,71,44,${.05+.12*(.5+.5*Math.sin(j*19.1))})`;vertical?g.fillRect(j,0,1,256):g.fillRect(0,j,256,1)}return texCanvas(c)}

const covers=await Promise.all(BOOKS.map(coverTexture));const books=[];const pickMeshes=[];
for(const [i,b] of BOOKS.entries()){const g=new THREE.Group(),m=new THREE.Group();g.add(m);scene.add(g);const colour=new THREE.Color(b.color),leather=new THREE.MeshPhysicalMaterial({color:colour.clone().multiplyScalar(.68),roughness:.57,clearcoat:.25,envMapIntensity:.55});const face=new THREE.MeshPhysicalMaterial({map:covers[i],roughness:.53,clearcoat:.22,clearcoatRoughness:.45,envMapIntensity:.55});const core=new THREE.Mesh(box,[pageH,leather,pageV,pageV,pageH,pageH]);m.add(core);const back=new THREE.Mesh(board,leather);back.position.z=-.124;m.add(back);const front=new THREE.Mesh(board,[leather,leather,leather,leather,face,leather]);front.position.z=.124;m.add(front);const binding=new THREE.Mesh(spine,leather);binding.position.x=-.612;m.add(binding);for(const mesh of [core,back,front,binding]){mesh.userData.book=i;pickMeshes.push(mesh)}g.rotation.y=.26;books.push({g,m,y:reduced?0:-3,v:0,z:0,vz:0,sx:0,sy:0});}
const canvas=renderer.domElement,temp=new THREE.Vector3(),ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let w=1,h=1,coarse=matchMedia('(pointer:coarse)').matches,pointer={x:-999,y:-999,active:false,last:0},down=null,raf=0,start=performance.now(),last=start,visible=true,lost=false;
function resize(){w=hero.clientWidth;h=hero.clientHeight;const mobile=w<=760;camera.fov=mobile?40:27;camera.aspect=w/h;camera.position.set(mobile?1.25:2.25,mobile?1.35:1.4,mobile?8.8:8.6);camera.lookAt(0,0,0);camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,mobile?1.5:2));renderer.setSize(w,h,false);const distance=camera.position.length(),vw=2*distance*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.aspect;const scale=Math.min(1.16,vw/(mobile?5.45:6.35),mobile?.86:1.16);const spacing=scale*(mobile?.92:1.01);for(let i=0;i<books.length;i++){const b=books[i];const j=i-2;b.g.scale.setScalar(scale);b.g.position.set(j*spacing,(mobile?-1.47:-1.05)+j*(mobile?-.065:-.065),j*.38*scale);b.g.rotation.y=.24;}camera.updateMatrixWorld();scene.updateMatrixWorld(true);}
function point(b){temp.set(0,.10,0);b.g.localToWorld(temp);temp.project(camera);b.sx=(temp.x+1)*w/2;b.sy=(1-temp.y)*h/2;}
function pointerMove(e){const rect=canvas.getBoundingClientRect();pointer.x=e.clientX-rect.left;pointer.y=e.clientY-rect.top;pointer.active=true;pointer.last=performance.now();if(down&&Math.hypot(pointer.x-down.x,pointer.y-down.y)>12)down.drag=true;}
canvas.addEventListener('pointermove',pointerMove,{passive:true});canvas.addEventListener('pointerdown',e=>{pointerMove(e);down={x:pointer.x,y:pointer.y,drag:false};if(e.pointerType!=='mouse')try{canvas.setPointerCapture(e.pointerId)}catch{};});
canvas.addEventListener('pointerup',e=>{pointerMove(e);if(down&&!down.drag){ndc.set(pointer.x/w*2-1,1-pointer.y/h*2);ray.setFromCamera(ndc,camera);const hit=ray.intersectObjects(pickMeshes,false)[0];if(hit)choose(hit.object.userData.book);}down=null;if(e.pointerType!=='mouse')pointer.active=false;});canvas.addEventListener('pointercancel',()=>{pointer.active=false;down=null});canvas.addEventListener('pointerleave',()=>{pointer.active=false});window.addEventListener('blur',()=>{pointer.active=false;down=null});

function draw(now){raf=0;if(!visible||lost)return;const t=(now-start)/1000,dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;scene.updateMatrixWorld(true);books.forEach(point);let px=pointer.x,py=pointer.y,active=pointer.active;if(!reduced&&t>2.1&&!down&&(coarse||now-pointer.last>4000)){const u=(Math.sin(t*.75-1)+1)/2,a=books[0],b=books[4];px=a.sx+(b.sx-a.sx)*u;py=a.sy+(b.sy-a.sy)*u;active=true}const s=Math.max(w,h)*(w<=760?.11:.085);let hot=false;for(let i=0;i<books.length;i++){const b=books[i];let lift=0;if(active&&!reduced){const dx=b.sx-px,dy=(b.sy-py)*.55;lift=.78*Math.exp(-(dx*dx+dy*dy)/(s*s));if(lift>.36)hot=true;}if(selected===i)lift=Math.max(lift,.88);if(reduced){b.y=selected===i?.2:0;b.z=0;b.v=0}else{const target=t>.25+(4-i)*.105?lift:-3;spring(b,target,Math.max(0,target)*.35,dt)}b.m.position.set(0,b.y,b.z);b.m.rotation.x=THREE.MathUtils.clamp(-b.v*.012,-.12,.12);}canvas.style.cursor=hot?'pointer':'default';renderer.render(scene,camera);raf=requestAnimationFrame(draw);}

window.addEventListener('resize',resize,{passive:true});document.addEventListener('visibilitychange',()=>{visible=!document.hidden;if(!visible&&raf){cancelAnimationFrame(raf);raf=0}else begin()});canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();lost=true;if(raf)cancelAnimationFrame(raf);raf=0;fallback.hidden=false;canvas.style.visibility='hidden';status.textContent='Static cover mode'});canvas.addEventListener('webglcontextrestored',()=>{lost=false;canvas.style.visibility='visible';fallback.hidden=true;status.textContent='3D editions';begin()});
resize();fallback.hidden=true;status.textContent='Five original editions';start=performance.now();begin();
}catch(e){console.warn('Unveiled 3D preview:',e);window.previewFailed();}
</script></body></html>
